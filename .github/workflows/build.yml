name: Compilar APK

on:
  push:
    branches: [ main, mia-launcher ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiaLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MiaLauncher
          path: MiaLauncher.apk
