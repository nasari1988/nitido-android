name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Misma llave de firma en todas las compilaciones, para que las
      # actualizaciones se instalen encima sin desinstalar.
      - uses: actions/cache@v4
        with:
          path: ~/limpio-keystore/limpio.jks
          key: limpio-keystore-v1
      - name: Pruebas y compilación
        run: |
          if [ ! -f ~/limpio-keystore/limpio.jks ]; then
            mkdir -p ~/limpio-keystore
            keytool -genkeypair -keystore ~/limpio-keystore/limpio.jks -alias limpio \
              -storepass limpio-ci -keypass limpio-ci -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Limpio"
          fi
          export LIMPIO_KEYSTORE=$HOME/limpio-keystore/limpio.jks
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Limpio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Limpio-apk
          path: Limpio.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "limpio-v${{ github.run_number }}" Limpio.apk \
            --target "$GITHUB_SHA" \
            --title "Limpio v${{ github.run_number }}" \
            --notes "APK de Limpio compilado desde la rama limpio." --prerelease
