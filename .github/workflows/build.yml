name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Limpio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Limpio-apk
          path: Limpio.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "limpio-v${{ github.run_number }}" Limpio.apk \
            --target "$GITHUB_SHA" \
            --title "Limpio v${{ github.run_number }}" \
            --notes "APK de Limpio compilado desde la rama limpio." --prerelease
