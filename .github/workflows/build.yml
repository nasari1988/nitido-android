name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Misma llave de firma en todas las compilaciones, para que las
      # actualizaciones se instalen encima sin desinstalar. Vive en la caché
      # de main (la mantiene viva "Mantener llave de Archivos").
      - uses: actions/cache/restore@v4
        with:
          path: ~/limpio-keystore/limpio.jks
          key: limpio-keystore-v2
          fail-on-cache-miss: true
      - name: Pruebas y compilación
        run: |
          export LIMPIO_KEYSTORE=$HOME/limpio-keystore/limpio.jks
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Archivos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Archivos-apk
          path: Archivos.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "archivos-v${{ github.run_number }}" Archivos.apk \
            --target "$GITHUB_SHA" \
            --title "Archivos v${{ github.run_number }}" \
            --notes "APK de Archivos (antes Limpio) compilado desde la rama limpio." --prerelease
