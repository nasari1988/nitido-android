name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: bash ci/build.sh

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" Nitido.apk \
            --title "Nítido 0.2.${{ github.run_number }}" \
            --notes "Toca Nitido.apk para instalarla."
