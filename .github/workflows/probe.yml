name: Revisar modelos NPU
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q onnx onnxruntime numpy
      - name: Revisar
        run: |
          B=https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models
          cat > io.py <<'PY'
          import sys, onnx, onnxruntime as ort, numpy as np
          from onnx import TensorProto
          m = onnx.load(sys.argv[1], load_external_data=False)
          for v in list(m.graph.input) + list(m.graph.output):
              t = v.type.tensor_type
              print("  ", v.name, TensorProto.DataType.Name(t.elem_type), [d.dim_value or d.dim_param for d in t.shape.dim])
          ops = {}
          for n in m.graph.node: ops[n.op_type] = ops.get(n.op_type, 0) + 1
          print("   ops", sorted(ops.items(), key=lambda x: -x[1])[:25])
          try:
              s = ort.InferenceSession(sys.argv[1], providers=["CPUExecutionProvider"])
              feeds = {}
              for i in s.get_inputs():
                  sh = [d if isinstance(d, int) else 1 for d in i.shape]
                  dt = {"tensor(float)": np.float32, "tensor(uint8)": np.uint8, "tensor(uint16)": np.uint16}.get(i.type, np.float32)
                  feeds[i.name] = (np.random.rand(*sh) * (255 if dt != np.float32 else 1)).astype(dt)
              for o, y in zip(s.get_outputs(), s.run(None, feeds)):
                  print("   salida", o.name, y.dtype, y.shape, "min", float(y.min()), "max", float(y.max()))
          except Exception as e:
              print("   no corre en CPU:", e)
          PY
          for m in ddcolor lama_dilated; do
            for v in v0.65.0 v0.64.0 v0.63.0 v0.50.1; do
              for p in w8a16 w8a8 float; do
                z=$m-onnx-$p.zip
                if curl -sfL -o $z "$B/$m/releases/$v/$z"; then
                  echo "=== $m $v $p ($(du -h $z | cut -f1))"
                  rm -rf x && mkdir x && unzip -q $z -d x
                  find x -type f -exec ls -la {} \;
                  cat $(find x -name metadata.json | head -1) 2>/dev/null | head -c 1500; echo
                  python3 io.py $(find x -name '*.onnx' | head -1)
                fi
              done
            done
          done
