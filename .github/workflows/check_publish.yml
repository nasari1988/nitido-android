name: Publicar imágenes de prueba

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Corrida de la prueba
        required: true
      artefacto:
        description: Nombre del artefacto
        default: prueba-sdxl
      privado:
        description: "si = borrador (solo lo ve el dueño del repositorio)"
        default: "no"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artefacto }}
          path: check
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ART: ${{ inputs.artefacto }}
          PRIV: ${{ inputs.privado }}
        run: |
          ls -la check
          if [ "$PRIV" = "si" ]; then
            TAG="privado-$ART"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "Borrador privado para pruebas (no es para la app)."
          else
            TAG="$ART"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Prueba $TAG" --notes "Imágenes de la prueba (no es para la app)." --prerelease --latest=false
          fi
          gh release upload "$TAG" check/* --clobber
