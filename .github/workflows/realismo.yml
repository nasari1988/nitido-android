name: Convertir Realismo (PiSA-SR)

on:
  workflow_dispatch:

jobs:
  # no secrets and read-only: the checked weights in the repo and SD 2.1-base from Hugging Face
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Convertir
        run: bash ci/pisa_build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-realismo
          path: out/
          retention-days: 3

  # publishes the files; runs nothing from the model
  publish:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modelo-realismo
          path: out
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          TAG="modelo-realismo"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Realismo (PiSA-SR)" --notes "Restaurar → Realismo. La app lo descarga sola." --latest=false
          gh release upload "$TAG" out/* --clobber
