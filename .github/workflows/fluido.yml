name: Convertir para la NPU
run-name: "Convertir para la NPU: ${{ inputs.que }}"

on:
  workflow_dispatch:
    inputs:
      que:
        description: "Qué convertir: fluido (RIFE), realismo (PiSA-SR), limpiar-npu (RealBasicVSR), enfocar-npu (NAFNet), pose-npu[-WxH] (ControlNet de pose) o dreamlite-npu[-WxH] (editor DreamLite)"
        default: fluido

jobs:
  # no secrets and read-only: only checked weights in the repo (and SD 2.1-base from Hugging Face for realismo)
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Python 3.10 para las herramientas de la NPU
        id: py310
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          update-environment: false
      - name: Convertir
        env:
          PY310: ${{ steps.py310.outputs.python-path }}
        run: |
          case "${{ inputs.que }}" in
            realismo) bash ci/pisa_build.sh ;;
            limpiar) bash ci/rbvsr_build.sh ;;
            limpiar-npu) bash ci/rbvsr_npu_build.sh ;;
            enfocar-npu) bash ci/nafnet_build.sh ;;
            dreamlite-prueba) bash ci/dreamlite_try.sh ;;
            lector-dreamlite) bash ci/qwenvl_build.sh ;;
            pose-npu) bash ci/control_pose_build.sh ;;
            dreamlite-npu) bash ci/dreamlite_npu_build.sh ;;
            dreamlite-npu-*) Q="${{ inputs.que }}"; bash ci/dreamlite_npu_build.sh "${Q#dreamlite-npu-}" ;;
            pose-npu-*) Q="${{ inputs.que }}"; bash ci/control_pose_build.sh "${Q#pose-npu-}" ;;
            *) bash ci/rife_build.sh ;;
          esac
      # Limpiar (prueba): the checked weights for a private test run elsewhere; never published
      - if: ${{ inputs.que == 'limpiar' }}
        uses: actions/upload-artifact@v4
        with:
          name: pesos-limpiar
          path: dl/rbvsr.pth
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-${{ inputs.que }}
          path: out/
          retention-days: 3

  # publishes the files; runs nothing from the model
  publish:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modelo-${{ inputs.que }}
          path: out
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          if [ "${{ inputs.que }}" = "dreamlite-prueba" ]; then
            # sample photos edited on the server: a test page, not a model
            T=prueba-dreamlite
            gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "Prueba de DreamLite (fotos de muestra)" --notes "Ediciones de prueba con DreamLite-mobile en el servidor." --prerelease
            gh release upload "$T" out/* --clobber
            exit 0
          fi
          if [ "${{ inputs.que }}" = "enfocar-npu" ]; then
            # NAFNet's NPU files go into the restoration pack; its list gets them (the app offers the update)
            T=modelo-restauracion
            gh release download "$T" -p files.txt -O old_files.txt
            gh release upload "$T" out/rest_*.npu* out/check_* --clobber
            grep -v -E '^(rest_deblur|rest_denoise)\.npu' old_files.txt > files.txt || true
            (cd out && for f in rest_*.npu*; do echo "$f $(stat -c %s "$f")"; done) >> files.txt
            cat files.txt
            gh release upload "$T" files.txt --clobber
            exit 0
          fi
          case "${{ inputs.que }}" in pose-npu*|dreamlite-npu*)
            # every size in one release; its list keeps the sizes built before
            case "${{ inputs.que }}" in
              pose-npu*) T=modelo-control-pose-npu; NOTES="ControlNet de pose (xinsir, Apache-2.0) para Editar › pulir con SDXL. La app lo descarga sola." ;;
              *) T=modelo-dreamlite-npu; NOTES="DreamLite-mobile (ByteDance, pesos CC BY-NC 4.0: uso no comercial) para Editar › paso 1. La app lo descarga sola." ;;
            esac
            gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "$T" --notes "$NOTES" --latest=false
            gh release download "$T" -p files.txt -O old_files.txt 2>/dev/null || touch old_files.txt
            (cd out && ls | grep -v '^files.txt$' | xargs -I{} gh release upload "$T" "{}" --clobber)
            cp out/files.txt files.txt
            while read -r name size; do
              [ -n "$name" ] && [ "$name" != files.txt ] && ! grep -q "^$name " files.txt && echo "$name $size" >> files.txt
            done < old_files.txt
            cat files.txt
            gh release upload "$T" files.txt --clobber
            exit 0 ;;
          esac
          TAG="modelo-${{ inputs.que }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "La app lo descarga sola." --latest=false
          gh release upload "$TAG" out/* --clobber
