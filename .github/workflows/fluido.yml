name: Convertir Más fluido (RIFE)

on:
  workflow_dispatch:
    inputs:
      que:
        description: "Qué convertir: fluido (RIFE) o realismo (PiSA-SR)"
        default: fluido

jobs:
  # no secrets and read-only: only checked weights in the repo (and SD 2.1-base from Hugging Face for realismo)
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: Python 3.10 para las herramientas de la NPU
        id: py310
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          update-environment: false
      - name: Convertir
        env:
          PY310: ${{ steps.py310.outputs.python-path }}
        run: |
          if [ "${{ inputs.que }}" = "realismo" ]; then bash ci/pisa_build.sh; else bash ci/rife_build.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-${{ inputs.que }}
          path: out/
          retention-days: 3

  # publishes the files; runs nothing from the model
  publish:
    needs: convert
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modelo-${{ inputs.que }}
          path: out
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          TAG="modelo-${{ inputs.que }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "La app lo descarga sola." --latest=false
          gh release upload "$TAG" out/* --clobber
