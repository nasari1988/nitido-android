name: Convertir modelo

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: Modelo a convertir (o "personalizado" para usar un enlace; SD 1.5 o SDXL)
        type: choice
        options: [personalizado, dreamshaper8, realistic, anime, pix2pix]
      enlace:
        description: "Solo personalizado: enlace de Hugging Face o Civitai (página del modelo o archivo .safetensors)"
        type: string
        required: false
      nombre:
        description: "Solo personalizado: nombre corto para la app (letras, números y guiones; ej. mi-modelo)"
        type: string
        required: false
      precision:
        description: "Precisión: 8 bits (más ligero) o 16 bits (más fiel). SDXL siempre usa 8 bits"
        type: choice
        options: ["16", "8"]
      lora:
        description: "Opcional: enlace de una LoRA para mezclarla en el modelo (Hugging Face, Civitai o descarga directa)"
        type: string
        required: false
      lora_peso:
        description: "Opcional: fuerza de la LoRA (0.1 a 1.5; normal 0.7–0.9)"
        type: string
        required: false
        default: "0.8"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .

      - name: Revisar datos
        id: datos
        env:
          MODELO: ${{ inputs.modelo }}
          PRECISION: ${{ inputs.precision }}
          ENLACE: ${{ inputs.enlace }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          if [ "$MODELO" = "personalizado" ]; then
            ID=$(echo "$NOMBRE" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-\n' '-' | sed 's/^-*//;s/-*$//')
            if [ -z "$ENLACE" ] || [ -z "$ID" ]; then
              echo "::error::Para 'personalizado' escribe el enlace y el nombre."
              exit 1
            fi
          else
            ID="$MODELO"
            ENLACE=""
            if [ "$PRECISION" = "16" ]; then ID="$MODELO-16"; fi
          fi
          echo "Nombre en la app: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "enlace=$ENLACE" >> "$GITHUB_OUTPUT"

      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Convertir
        env:
          CIVITAI_TOKEN: ${{ secrets.CIVITAI_TOKEN }}
          LORA: ${{ inputs.lora }}
          LORA_PESO: ${{ inputs.lora_peso }}
        run: bash ci/convert_model.sh "${{ steps.datos.outputs.id }}" "${{ steps.datos.outputs.enlace }}" "${{ inputs.precision }}" "$LORA" "$LORA_PESO"

      - name: Publicar modelo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="modelo-${{ steps.datos.outputs.id }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Modelo ${{ steps.datos.outputs.id }}" --notes "Archivos del modelo para la app. En la app: Agregar modelo → ${{ steps.datos.outputs.id }}" --latest=false
          gh release upload "$TAG" out/* --clobber
