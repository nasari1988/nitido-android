name: Convertir modelo

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: Modelo a convertir
        type: choice
        options: [dreamshaper8, realistic, anime, pix2pix]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o -q project.zip -d .

      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Convertir
        run: bash ci/convert_model.sh "${{ inputs.modelo }}"

      - name: Publicar modelo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="modelo-${{ inputs.modelo }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Modelo ${{ inputs.modelo }}" --notes "Archivos del modelo para la app." --latest=false
          gh release upload "$TAG" out/* --clobber
