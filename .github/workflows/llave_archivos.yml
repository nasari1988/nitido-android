name: Mantener llave de Archivos

# La llave que firma Archivos (rama limpio) vive en la caché de esta rama
# principal. GitHub borra cachés sin uso tras 7 días, así que esto la toca
# cada semana. La compilación de la rama limpio la lee de aquí.
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:

jobs:
  llave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: llave
        with:
          path: ~/limpio-keystore/limpio.jks
          key: limpio-keystore-v2
      - name: Crear la llave si no existe
        if: steps.llave.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/limpio-keystore
          keytool -genkeypair -keystore ~/limpio-keystore/limpio.jks -alias limpio \
            -storepass limpio-ci -keypass limpio-ci -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Archivos"
      - name: Huella
        run: keytool -list -v -keystore ~/limpio-keystore/limpio.jks -storepass limpio-ci | grep -E "SHA1|SHA256"
